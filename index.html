<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Cursos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      padding: 28px 7%;
    }

    h1 {
      text-align: center;
      margin: 10px 0 30px;
      font-size: 42px;
    }

    .lista {
      display: flex;
      flex-direction: column;
      gap: 22px;
      max-width: 950px;
      margin: auto;
    }

    .curso {
      min-height: 145px;
      border: 1px solid #303030;
      border-radius: 22px;
      background: #151515;
      display: flex;
      align-items: center;
      padding: 22px 42px;
      gap: 35px;
    }

    .icone {
      width: 150px;
      height: 125px;
      border: 1px solid #444;
      border-radius: 18px;
      background: linear-gradient(145deg, #252525, #111);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      color: #aaa;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
    }

    .info h2 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 500;
    }

    .info p {
      margin: 0;
      color: #999;
      font-size: 20px;
    }

    .acessar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 16px 28px;
      border-radius: 22px;
      background: #303030;
      color: white;
      text-decoration: none;
      font-size: 22px;
      transition: .2s;
    }

    .acessar:hover {
      background: #404040;
      transform: scale(1.02);
    }

    @media (max-width: 700px) {
      body {
        padding: 18px 14px;
      }

      h1 {
        font-size: 34px;
      }

      .curso {
        padding: 20px;
        gap: 18px;
      }

      .icone {
        width: 95px;
        height: 90px;
        font-size: 30px;
      }

      .info h2 {
        font-size: 22px;
      }

      .info p {
        font-size: 16px;
      }

      .acessar {
        min-width: 100px;
        padding: 13px 15px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <h1>Meus Cursos</h1>

  <div class="lista">

    <div class="curso">
      <div class="icone">&lt;/&gt;</div>
      <div class="info">
        <h2>Curso JS</h2>
        <p>Código · HTML</p>
      </div>
      <a class="acessar" href="curso_js.html">Acessar</a>
    </div>

    <div class="curso">
      <div class="icone">&lt;/&gt;</div>
      <div class="info">
        <h2>Curso Python</h2>
        <p>Código · HTML</p>
      </div>
      <a class="acessar" href="curso_python.html">Acessar</a>
    </div>

    <div class="curso">
      <div class="icone">&lt;/&gt;</div>
      <div class="info">
        <h2>Curso HTML</h2>
        <p>Código · HTML</p>
      </div>
      <a class="acessar" href="curso_html.html">Acessar</a>
    </div>

    <div class="curso">
      <div class="icone">&lt;/&gt;</div>
      <div class="info">
        <h2>Curso CSS</h2>
        <p>Código · HTML</p>
      </div>
      <a class="acessar" href="curso_css.html">Acessar</a>
    </div>

  </div>

</body>
</html>
